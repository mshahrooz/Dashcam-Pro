name: Measure improved critical image priority
on:
  push:
    branches: [perf/optimize-mobile-pagespeed]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit optimized mobile homepage
        shell: bash
        run: |
          npm install -g lighthouse@12 >/tmp/npm.log 2>&1
          python3 -m http.server 9876 --bind 127.0.0.1 --directory . >/tmp/http.log 2>&1 &
          sleep 2
          lighthouse http://127.0.0.1:9876/index.html --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --form-factor=mobile --screenEmulation.mobile=true --screenEmulation.width=390 --screenEmulation.height=844 --screenEmulation.deviceScaleFactor=2 --throttling-method=simulate --only-categories=performance,accessibility,best-practices,seo --output=json --output-path=/tmp/score.json --quiet
          python3 - <<'PY' > perf-critical-test.txt
          import json
          d=json.load(open('/tmp/score.json'))
          print('SCORES',{k:round(v.get('score',0)*100) for k,v in d['categories'].items()})
          for k in ['first-contentful-paint','largest-contentful-paint','speed-index','total-blocking-time','cumulative-layout-shift','interactive']:
              a=d['audits'][k]
              print(k,a.get('displayValue'),a.get('numericValue'))
          a=d['audits']['largest-contentful-paint-element']
          for item in a.get('details',{}).get('items',[]):
              if item.get('type')=='table' and item.get('headings',[{}])[0].get('key')=='phase':
                  print('LCP PHASES',item.get('items'))
          for key in ['render-blocking-resources','link-text','font-display-insight','uses-responsive-images']:
              a=d['audits'].get(key,{})
              print('AUDIT',key,a.get('score'),a.get('displayValue'))
          PY
          cat perf-critical-test.txt
      - name: Save metric snapshot
        if: always()
        shell: bash
        run: |
          git add perf-critical-test.txt || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Capture final LCP optimization metric [skip ci]' || true
          git push origin HEAD:perf/optimize-mobile-pagespeed || true
