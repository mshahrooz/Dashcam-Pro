name: Diagnose GitHub Pages video delivery
on:
  push:
    branches: [diagnostics/video-pages-delivery]
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Measure live media delivery and HTML
        run: |
          python - <<'PY' > video-delivery-results.txt 2>&1
          import urllib.request,urllib.error,traceback,subprocess,pathlib
          from html.parser import HTMLParser
          base="https://mshahrooz.github.io/Dashcam-Pro/"
          for target in ['generated/dashcam-driving.mp4','contact.html','index.html','assets/css/styles.css']:
              url=base+target
              print("\nURL:",url)
              try:
                  request=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 Dashcam-video-diagnostics","Range":"bytes=0-2047"} if target.endswith('.mp4') else {"User-Agent":"Mozilla/5.0 Dashcam-video-diagnostics"})
                  with urllib.request.urlopen(request,timeout=25) as response:
                      print("HTTP",response.status,"final",response.url,"Content-Type",response.headers.get('Content-Type'),"Content-Length",response.headers.get('Content-Length'),"Content-Range",response.headers.get('Content-Range'))
                      data=response.read(4*1024*1024 if target.endswith('.mp4') else 150000)
                      print("BODY BYTES",len(data),"first_bytes",repr(data[:24]))
                      if target.endswith('.html'):
                          s=data.decode('utf-8','replace')
                          print("HAS MP4 PATH", "dashcam-driving.mp4" in s, "HAS VIDEO ELEMENT", "<video" in s)
                          p=s.find("dashcam-driving.mp4")
                          print("VIDEO HTML",s[max(0,p-320):p+190])
              except Exception as e:print("ERROR",type(e).__name__,str(e))
          print("\nLOCAL MEDIA",pathlib.Path("generated/dashcam-driving.mp4").exists())
          print("LOCAL SIZE",pathlib.Path("generated/dashcam-driving.mp4").stat().st_size if pathlib.Path("generated/dashcam-driving.mp4").exists() else None)
          PY
          cat video-delivery-results.txt
      - name: Save results to diagnostic branch
        if: always()
        run: |
          git add video-delivery-results.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Save published video diagnostics [skip ci]' || exit 0
          git push origin HEAD:diagnostics/video-pages-delivery
