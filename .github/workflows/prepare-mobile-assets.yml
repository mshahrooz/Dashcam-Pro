name: Compile production assets for PageSpeed
on:
  push:
    branches: [perf/optimize-mobile-pagespeed]
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned build tools
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund tailwindcss@3.4.17 lucide-static@1.70.0
          python -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Replace runtime icons with the same pre-rendered SVGs
        run: python scripts/inline_lucide.py
      - name: Reencode large raster illustrations to modern format
        run: python scripts/optimize_images.py
      - name: Generate minified zero-runtime Tailwind CSS
        run: |
          npx tailwindcss -i ./assets/css/tailwind-source.css -o ./assets/css/tailwind.min.css --minify
          test -s assets/css/tailwind.min.css
          du -h assets/css/tailwind.min.css
      - name: Verify that templates and generated assets match
        run: |
          python - <<'PY'
          import json,re,pathlib
          base=pathlib.Path('.')
          pages=[p['path'] for p in json.loads((base/'assets/js/pages-manifest.json').read_text())]
          css=(base/'assets/css/tailwind.min.css').read_text()
          assert len(css)>10000 and 'bg-red-600' in css and 'sm' in css, 'compiled CSS incomplete'
          for page in pages:
              for file in [base/page,base/'site-templates'/page]:
                  html=file.read_text()
                  assert 'cdn.tailwindcss.com' not in html, file
                  assert 'unpkg.com/lucide@' not in html, file
                  assert 'data-lucide' not in html, file
                  assert 'tailwind.min.css' in html, file
                  for src in re.findall(r'src="([^"]+\.webp)"',html):
                      target=(base/pathlib.Path(page).parent/src).resolve()
                      assert target.is_file(), f'{file}: missing {src}'
          homepage=(base/'index.html').read_text()
          assert 'preload="none"' in homepage and 'dashcam-driving.mp4' in homepage
          print('Validated all 28 HTML pages, inline icons, WebP links and production CSS.')
          PY
      - name: Save built files back to the feature branch
        shell: bash
        run: |
          set -euo pipefail
          git add -u -- '*.html'
          git add assets/css/tailwind.min.css generated/*.webp assets/images/before-after/*.webp
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'Compile production Tailwind, inline icons, optimize WebP images [skip ci]'
            git push origin HEAD:perf/optimize-mobile-pagespeed
          else
            echo 'No new optimization artifacts.'
          fi
