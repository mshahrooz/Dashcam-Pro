name: Generate responsive WebP variants
on:
  push:
    branches: [perf/optimize-mobile-pagespeed]
permissions:
  contents: write
jobs:
  srcset:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create 480px and 768px responsive variants
        run: |
          python -m pip install --disable-pip-version-check pillow==11.3.0
          python scripts/create_srcsets.py
      - name: Verify image paths
        run: |
          python - <<'PY'
          import json,pathlib,re
          root=pathlib.Path('.')
          pages=json.loads((root/'assets/js/pages-manifest.json').read_text())
          for p in pages:
              page=p['path']
              html=(root/'site-templates'/page).read_text()
              for srcset in re.findall(r'srcset="([^"]+)"',html):
                  for item in srcset.split(','):
                      url=item.strip().split(' ')[0]
                      if url.startswith(('http','data:')):continue
                      assert (root/pathlib.Path(page).parent/url).exists(),(page,url)
          PY
      - name: Commit responsive assets and source tags
        shell: bash
        run: |
          git add -u -- '*.html'
          git add generated/*-480.webp generated/*-768.webp assets/images/before-after/*-480.webp assets/images/before-after/*-768.webp
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add responsive WebP image variants and srcsets [skip ci]'
          git push origin HEAD:perf/optimize-mobile-pagespeed
