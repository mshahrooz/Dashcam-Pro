name: Measure mobile Lighthouse before optimization
on:
  push:
    branches: [perf/optimize-mobile-pagespeed]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Lighthouse audit for existing live homepage
        shell: bash
        run: |
          set -uo pipefail
          npm install -g lighthouse@12 > /tmp/lighthouse-install.log 2>&1 || true
          lighthouse https://mshahrooz.github.io/Dashcam-Pro/index.html --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --preset=desktop --only-categories=performance,accessibility,best-practices,seo --output=json --output-path=/tmp/lighthouse-desktop.json --quiet || true
          lighthouse https://mshahrooz.github.io/Dashcam-Pro/index.html --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --form-factor=mobile --screenEmulation.mobile=true --screenEmulation.width=390 --screenEmulation.height=844 --screenEmulation.deviceScaleFactor=2 --throttling-method=simulate --only-categories=performance,accessibility,best-practices,seo --output=json --output-path=/tmp/lighthouse-mobile.json --quiet || true
          python - <<'PY' > lighthouse-baseline.txt 2>&1
          import json, pathlib
          for mode in ['mobile','desktop']:
              print('\n===== BASELINE '+mode+' =====')
              p=pathlib.Path('/tmp/lighthouse-'+mode+'.json')
              if not p.is_file():
                  print('Audit output unavailable');continue
              d=json.loads(p.read_text())
              print('URL:',d.get('finalDisplayedUrl'))
              print('Scores:',{k:v.get('score') for k,v in d.get('categories',{}).items()})
              for id in ['first-contentful-paint','largest-contentful-paint','speed-index','total-blocking-time','cumulative-layout-shift','interactive']:
                  a=d.get('audits',{}).get(id,{})
                  print(id,a.get('displayValue'),a.get('numericValue'),a.get('score'))
              print('Largest contentful element', d.get('audits',{}).get('largest-contentful-paint-element',{}).get('details',{}))
              print('SUGGESTIONS:')
              aud=d.get('audits',{})
              for key,item in sorted(aud.items(),key=lambda e:e[1].get('numericValue') or 0,reverse=True):
                  if item.get('score') is not None and item.get('score',1)<.9 and (item.get('details',{}).get('overallSavingsMs') or item.get('details',{}).get('overallSavingsBytes') or item.get('scoreDisplayMode') in ['binary','numeric']):
                      print(key,'score',item.get('score'),'value',item.get('displayValue'),'savings',item.get('details',{}).get('overallSavingsMs'),item.get('details',{}).get('overallSavingsBytes'),'title',item.get('title'))
          PY
          cat lighthouse-baseline.txt
      - name: Store baseline on feature branch only
        if: always()
        run: |
          git add lighthouse-baseline.txt || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Record baseline Lighthouse diagnostics [skip ci]' || true
          git push origin HEAD:perf/optimize-mobile-pagespeed || true
