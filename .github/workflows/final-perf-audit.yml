name: Final audit mobile SEO and performance
on:
  push:
    branches: [perf/optimize-mobile-pagespeed]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Lighthouse the optimized site
        shell: bash
        run: |
          npm install -g lighthouse@12 >/tmp/lighthouse-install.log 2>&1
          python3 -m http.server 8765 --bind 127.0.0.1 --directory . >/tmp/server.log 2>&1 &
          sleep 2
          lighthouse http://127.0.0.1:8765/index.html --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --form-factor=mobile --screenEmulation.mobile=true --screenEmulation.width=390 --screenEmulation.height=844 --screenEmulation.deviceScaleFactor=2 --throttling-method=simulate --only-categories=performance,accessibility,best-practices,seo --output=json --output-path=/tmp/final-lighthouse.json --quiet
          python3 - <<'PY' > perf-final-audit.txt
          import json
          d=json.load(open('/tmp/final-lighthouse.json'))
          print('Scores:',{k:round(v.get('score',0)*100) for k,v in d['categories'].items()})
          for key in ['first-contentful-paint','largest-contentful-paint','speed-index','total-blocking-time','cumulative-layout-shift','interactive']:
              a=d['audits'][key]
              print(key,a.get('displayValue'),a.get('numericValue'))
          for key in ['render-blocking-resources','uses-responsive-images','modern-image-formats','unused-javascript','color-contrast','aria-allowed-role','aria-required-attr','link-text','lcp-discovery-insight','largest-contentful-paint-element','layout-shifts','font-display-insight']:
              a=d['audits'].get(key,{})
              print('\nAUDIT',key,a.get('score'),a.get('displayValue'))
              for v in a.get('details',{}).get('items',[])[:8]:
                  print(' ',str(v)[:1200])
          PY
          cat perf-final-audit.txt
      - name: Save report
        if: always()
        shell: bash
        run: |
          git add perf-final-audit.txt || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Record performance and SEO verification [skip ci]' || true
          git push origin HEAD:perf/optimize-mobile-pagespeed || true
