name: Publish multipage Supabase CMS as static HTML

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dashcam-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: github-pages
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Import new multipage website (first deployment only)
        run: |
          if test -f cms-site-bootstrap.tar.xz; then
            tar -xJf cms-site-bootstrap.tar.xz -C .
            echo 'Imported the uploaded fourteen-page site and visual editor.'
          fi
          test -f site-templates/index.html
          test -f scripts/build_pages.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lightweight HTML parser
        run: python -m pip install --disable-pip-version-check beautifulsoup4==4.12.3
      - name: Render all pages with the current published Supabase content
        run: python scripts/build_pages.py
      - name: Commit updated HTML source to GitHub
        run: |
          cp _site/cms-pages.json cms-pages.json
          while IFS= read -r path; do
            cp "_site/$path" "$path"
          done < <(python -c 'import json;print("\n".join(p["path"] for p in json.load(open("assets/js/pages-manifest.json"))))')
          rm -f cms-site-bootstrap.tar.xz
          git rm -f --ignore-unmatch site-template.html scripts/build-seo.cjs scripts/check-cms.cjs admin/visual.js cms-data.json || true
          git add -A
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore: publish all multipage content into HTML [skip ci]'
            git push origin HEAD:main
          else
            echo 'Every HTML page already matches the published CMS.'
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site
      - uses: actions/deploy-pages@v4
