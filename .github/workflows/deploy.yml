name: Publish Supabase edits as source HTML

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dashcam-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment: github-pages
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check scheduled changes
        id: cms
        if: github.event_name == 'schedule'
        run: node scripts/check-cms.cjs
      - name: Install browser renderer
        if: github.event_name != 'schedule' || steps.cms.outputs.changed == 'true'
        run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Install compatible Chromium
        if: github.event_name != 'schedule' || steps.cms.outputs.changed == 'true'
        run: npx playwright install --with-deps chromium
      - name: Build static HTML using published CMS
        if: github.event_name != 'schedule' || steps.cms.outputs.changed == 'true'
        run: node scripts/build-seo.cjs
      - name: Synchronize repository HTML with published content
        if: github.event_name != 'schedule' || steps.cms.outputs.changed == 'true'
        run: |
          cp _site/index.html index.html
          cp _site/cms-data.json cms-data.json
          git add index.html cms-data.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: publish Supabase content into HTML [skip ci]"
            git push origin HEAD:main
          else
            echo "HTML already synchronized."
          fi
      - uses: actions/configure-pages@v5
        if: github.event_name != 'schedule' || steps.cms.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'schedule' || steps.cms.outputs.changed == 'true'
        with:
          path: ./_site
      - uses: actions/deploy-pages@v4
        if: github.event_name != 'schedule' || steps.cms.outputs.changed == 'true'
