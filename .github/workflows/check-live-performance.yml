name: Verify live mobile site performance once
on:
  push:
    branches: [verify/mobile-production-lighthouse]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Lighthouse
        run: npm install -g lighthouse@12 --no-audit --no-fund
      - name: Measure published mobile page
        run: |
          lighthouse https://mshahrooz.github.io/Dashcam-Pro/index.html \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
            --form-factor=mobile \
            --screenEmulation.mobile=true \
            --screenEmulation.width=390 \
            --screenEmulation.height=844 \
            --screenEmulation.deviceScaleFactor=2 \
            --throttling-method=simulate \
            --only-categories=performance,accessibility,best-practices,seo \
            --output=json --output-path=/tmp/site-lh.json --quiet
          python - <<'PY'
          import json
          report=json.load(open('/tmp/site-lh.json'))
          print("LIVE MOBILE SCORES", {k:round(v.get('score',0)*100) for k,v in report['categories'].items()})
          for key in ('first-contentful-paint','largest-contentful-paint','speed-index','total-blocking-time','cumulative-layout-shift'):
              audit=report['audits'][key]
              print(key, audit.get('displayValue'), audit.get('numericValue'))
          for key in ('render-blocking-resources','lcp-discovery-insight','font-display-insight','uses-responsive-images','modern-image-formats','unused-javascript','largest-contentful-paint-element'):
              audit=report['audits'].get(key,{})
              print('DIAGNOSTIC',key,audit.get('score'),audit.get('displayValue'))
          PY
