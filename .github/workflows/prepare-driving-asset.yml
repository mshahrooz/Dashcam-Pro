name: Temporary fetch and optimize driving footage
on:
  push:
    branches: [feature/dashcam-driving-video]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose original clip availability and produce video if available
        shell: bash
        run: |
          mkdir -p generated
          status="$(curl -sSL --max-time 90 -w '%{http_code}' 'https://videos.pexels.com/video-files/5382495/5382495-hd_1280_720_24fps.mp4' -o /tmp/dashcam-original.mp4 || true)"
          printf 'CDN status: %s\n' "$status" > video-diagnostic.txt
          sha256sum /tmp/dashcam-original.mp4 >> video-diagnostic.txt || true
          du -h /tmp/dashcam-original.mp4 >> video-diagnostic.txt || true
          if [ "$status" = "200" ] && echo '09732291425f05f54a1ee6709c94faf4c84fbe76af3c007993268781b2e31359  /tmp/dashcam-original.mp4' | sha256sum -c -; then
            ffmpeg -hide_banner -loglevel error -y -i /tmp/dashcam-original.mp4 -map 0:v:0 -an -vf scale=960:-2 -c:v libx264 -preset medium -crf 29 -pix_fmt yuv420p -movflags +faststart generated/dashcam-driving.mp4
            test -s generated/dashcam-driving.mp4
            du -h generated/dashcam-driving.mp4 >> video-diagnostic.txt
          fi
          git add video-diagnostic.txt generated/dashcam-driving.mp4 2>/dev/null || git add video-diagnostic.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Record driving footage retrieval diagnostics [skip ci]'
          git push origin HEAD:feature/dashcam-driving-video
